<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABAWAQAYO 🔍</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0d0d1f 0%, #1a1035 55%, #251245 100%);
    color: #f0eefa; min-height: 100vh; padding-bottom: 40px;
  }
  header { text-align:center; padding: 22px 16px 8px; }
  header h1 {
    font-size: 1.9rem; letter-spacing: 2px;
    background: linear-gradient(90deg,#ffd166,#ef476f,#c77dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    user-select:none;
  }
  header p { color:#b9b3d9; font-size:.85rem; margin-top:4px; }

  /* Compte à rebours */
  #countdownBox {
    display:none; margin: 12px 14px 0; padding: 14px; border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,209,102,.14), rgba(199,125,255,.14));
    border: 1px solid rgba(255,209,102,.45); text-align:center;
  }
  #countdownBox .cd-label { font-size:.8rem; color:#ffd166; letter-spacing:1px; text-transform:uppercase; }
  #countdownBox .cd-time { font-size:1.7rem; font-weight:800; font-variant-numeric: tabular-nums; margin-top:4px; }
  #countdownBox .cd-lieu { margin-top:6px; font-size:.95rem; color:#f0eefa; }

  #menu { padding: 14px; display:flex; flex-direction:column; gap:10px; }
  .clue-btn {
    display:flex; align-items:center; gap:12px; width:100%;
    padding: 14px 14px; border-radius: 16px; border:1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06); color:#f0eefa;
    font-size:1rem; text-align:left; cursor:pointer;
    transition: transform .08s, background .2s;
  }
  .clue-btn:active { transform: scale(.985); }
  .clue-btn .lock { font-size:1.25rem; }
  .clue-btn .txt { flex:1; min-width:0; }
  .clue-btn .txt .n { font-weight:700; font-size:.95rem; }
  .clue-btn .txt .name { font-size:.85rem; color:#b9b3d9; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .clue-btn .scan {
    font-size:.75rem; padding:8px 11px; border-radius:999px; border:none;
    background: linear-gradient(90deg,#7b2ff7,#c77dff); color:#fff; font-weight:700;
    flex-shrink:0;
  }
  .clue-btn.done {
    background: linear-gradient(90deg, rgba(6,214,160,.20), rgba(6,214,160,.10));
    border-color: rgba(6,214,160,.6);
  }
  .clue-btn.done .txt .name { color:#06d6a0; font-weight:800; font-size:.95rem; }
  .clue-btn.done .scan { display:none; }

  /* Pages épreuve */
  .page { display:none; padding: 16px; max-width: 560px; margin: 0 auto; }
  .page.active { display:block; }
  .card {
    background: rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
    border-radius: 20px; padding: 20px; margin-top: 10px;
  }
  .card h2 { font-size:1.15rem; color:#ffd166; margin-bottom:12px; }
  .card p { line-height:1.55; margin-bottom:12px; white-space: pre-line; }
  .opt {
    display:block; width:100%; margin:8px 0; padding:13px 14px; border-radius:14px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05);
    color:#f0eefa; font-size:.98rem; text-align:left; cursor:pointer;
  }
  .opt:active { background:rgba(255,255,255,.15); }
  .btn-main {
    display:block; width:100%; margin-top:14px; padding:14px; border-radius:14px; border:none;
    background: linear-gradient(90deg,#ef476f,#ffd166); color:#1a1035;
    font-weight:800; font-size:1rem; cursor:pointer;
  }
  .btn-ghost {
    display:block; width:100%; margin-top:10px; padding:12px; border-radius:14px;
    border:1px solid rgba(255,255,255,.25); background:transparent; color:#b9b3d9;
    font-size:.9rem; cursor:pointer;
  }
  input[type=text] {
    width:100%; padding:13px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.25); color:#fff; font-size:1rem; outline:none;
  }
  img.chess { width:100%; border-radius:14px; margin:8px 0 4px; }
  .bigemoji { font-size:5rem; text-align:center; margin:10px 0; }
  .iban { font-family: ui-monospace, monospace; background:rgba(0,0,0,.3); padding:10px; border-radius:10px; font-size:.85rem; text-align:center; }

  /* Modal */
  #modal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
    z-index:50; align-items:center; justify-content:center; padding:24px;
  }
  #modal .mbox {
    background:#221540; border:1px solid rgba(255,255,255,.2); border-radius:20px;
    padding:24px; max-width:420px; width:100%; text-align:center;
  }
  #modal .mbox .memoji { font-size:2.6rem; }
  #modal .mbox p { margin:12px 0 4px; font-size:1.05rem; line-height:1.5; white-space:pre-line; }

  /* Scanner */
  #scanPage #reader { border-radius:16px; overflow:hidden; }

  #toast {
    display:none; position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#ffd166; color:#1a1035; font-weight:700; padding:11px 18px;
    border-radius:999px; z-index:60; font-size:.9rem; max-width:88vw; text-align:center;
  }
  .confetti { position:fixed; top:-12px; z-index:40; font-size:1.3rem; animation: fall linear forwards; pointer-events:none; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
</style>
</head>
<body>

<header>
  <h1 id="title">ABAWAQAYO</h1>
  <p>Retrouve ton parrain mystère… 🕵️</p>
</header>

<div id="countdownBox">
  <div class="cd-label">Rendez-vous dans</div>
  <div class="cd-time" id="cdTime">--:--:--</div>
  <div class="cd-lieu" id="cdLieu"></div>
</div>

<div id="menu"></div>

<!-- Scanner -->
<div class="page" id="scanPage">
  <div class="card">
    <h2>📷 Scanne le QR code</h2>
    <div id="reader"></div>
    <button class="btn-ghost" onclick="stopScan()">Annuler</button>
  </div>
</div>

<div id="pages"></div>

<div id="modal"><div class="mbox">
  <div class="memoji" id="mEmoji">😬</div>
  <p id="mText"></p>
  <button class="btn-main" id="mBtn">Réessayer</button>
</div></div>

<div id="toast"></div>

<script>
/* ============================================================
   CONFIGURATION — À MODIFIER PAR LE PARRAIN
   ============================================================ */
const RDV_DATETIME = "2026-09-11T23:00:00";   // date & heure du rendez-vous final
const RDV_LIEU     = "📍 Lieu secret : ???";   // lieu révélé à la fin du compte à rebours
/* ============================================================ */

const CODES = { 2:"q2-7kf3", 3:"q3-9zm1", 4:"q4-2vd8", 5:"q5-6tp4",
                6:"q6-8rl2", 7:"q7-3hx9", 8:"q8-5nc7", 9:"q9-1wb6", 10:"q10-4gy5" };

const NAMES = { 1:"LAVOISIER", 2:"FAN DU LOSC", 3:"ARTLANTIDE", 4:"ULTRA DE DOUAI",
                5:"RESPO PÔLE FAUX", 6:"PREZ POKER'IMT", 7:"PREZ CHESS'MATE",
                8:"CAPSEUR AGUERRI", 9:"CAPITAINE 🫡", 10:"À TRÈS BIENTÔT 🫶" };

let state = JSON.parse(localStorage.getItem("abawaqayo") || "{}");
if (!state.done) state.done = [];
function save(){ localStorage.setItem("abawaqayo", JSON.stringify(state)); }
function isDone(n){ return state.done.includes(n); }

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}

/* ---------- MENU ---------- */
function renderMenu(){
  const m = document.getElementById("menu");
  m.innerHTML = "";
  for (let i=1; i<=10; i++){
    const done = isDone(i);
    const b = document.createElement("button");
    b.className = "clue-btn" + (done ? " done" : "");
    b.innerHTML = `<span class="lock">${done?"🔓":"🔒"}</span>
      <span class="txt"><div class="n">Indice N°${i}</div>
      <div class="name">${done?NAMES[i]:"???"}</div></span>` +
      (done ? "" : `<span class="scan">📷 Scanner</span>`);
    b.onclick = () => {
      if (done) { toast("Indice déjà validé ✅"); return; }
      startScan();
    };
    m.appendChild(b);
  }
  updateCountdownBox();
}

/* ---------- COMPTE À REBOURS ---------- */
let cdInterval = null;
function updateCountdownBox(){
  const box = document.getElementById("countdownBox");
  if (!isDone(10)) { box.style.display="none"; return; }
  box.style.display = "block";
  if (cdInterval) clearInterval(cdInterval);
  const tick = () => {
    const diff = new Date(RDV_DATETIME) - new Date();
    const t = document.getElementById("cdTime"), l = document.getElementById("cdLieu");
    if (diff <= 0){
      t.textContent = "C'EST L'HEURE ! 🎉";
      l.textContent = RDV_LIEU;
      clearInterval(cdInterval);
      return;
    }
    const h = Math.floor(diff/3600000), mn = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
    t.textContent = (h>0? String(h).padStart(2,"0")+":" : "") + String(mn).padStart(2,"0")+":"+String(s).padStart(2,"0");
    l.textContent = "Le lieu sera révélé à la fin du compte à rebours… 👀";
  };
  tick(); cdInterval = setInterval(tick, 1000);
}

/* ---------- NAVIGATION ---------- */
function show(id){
  document.getElementById("menu").style.display = id==="menu" ? "flex" : "none";
  document.getElementById("countdownBox").style.display = "none";
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  if (id !== "menu") document.getElementById(id).classList.add("active");
  if (id === "menu") renderMenu();
  window.scrollTo(0,0);
}

function complete(n){
  if (!isDone(n)) { state.done.push(n); save(); confetti(); }
  show("menu");
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>t.style.display="none", 2600);
}

function popup(emoji, text, btnLabel, cb){
  const M = document.getElementById("modal");
  document.getElementById("mEmoji").textContent = emoji;
  document.getElementById("mText").textContent = text;
  const b = document.getElementById("mBtn");
  b.textContent = btnLabel || "OK";
  b.onclick = () => { M.style.display="none"; if (cb) cb(); };
  M.style.display = "flex";
}

function confetti(){
  const em = ["🎉","✨","🎊","💜","💛"];
  for (let i=0;i<26;i++){
    const s = document.createElement("span");
    s.className="confetti"; s.textContent = em[i%em.length];
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 3600);
  }
}

/* ---------- SCANNER ---------- */
let scanner = null;
function startScan(){
  show("scanPage");
  scanner = new Html5Qrcode("reader");
  scanner.start({ facingMode:"environment" }, { fps:10, qrbox:{width:230,height:230} },
    (txt) => {
      stopScan();
      const frag = (txt.split("#")[1] || txt).trim();
      handleCode(frag);
    }
  ).catch(()=> {
    toast("Caméra indisponible — scanne le QR avec l'appareil photo du téléphone 📱");
    show("menu");
  });
}
function stopScan(){
  if (scanner){ scanner.stop().then(()=>scanner.clear()).catch(()=>{}); scanner = null; }
  show("menu");
}

function handleCode(code){
  const n = Object.keys(CODES).find(k => CODES[k] === code);
  if (!n){ toast("QR code non reconnu 🤔"); show("menu"); return; }
  if (isDone(+n)){ toast("Indice déjà validé ✅"); show("menu"); return; }
  openClue(+n);
}

/* ---------- OUVERTURE DES ÉPREUVES ---------- */
function openClue(n){
  if (n===2) resetQ2();
  if (n===4) resetQ4();
  show("page"+n);
}

/* ---------- INDICE 2 : quiz LOSC ---------- */
const Q2 = [
  { q:"Quel est le joueur le plus capé de l'Olympique de Marseille ?",
    opts:["Dimitri Payet","Mathieu Valbuena","Steve Mandanda","Joey Reano"], correct:2 },
  { q:"Combien de titres a le PSG en compétitions officielles ?",
    opts:["55","58","61","65"], correct:2 },
  { q:"Quel est le plus grand club de France ?",
    opts:["PSG","LOSC","LENS","MARSEILLE"], correct:1 }
];
let q2i = 0, q2attempts = 0, q2consec = 0;
function resetQ2(){ q2i = 0; q2attempts = 0; q2consec = 0; renderQ2(); }
function renderQ2(){
  const c = document.getElementById("q2box");
  const Q = Q2[q2i];
  c.innerHTML = `<p><b>Question ${q2i+1}/3</b>\n${Q.q}</p>` +
    Q.opts.map((o,idx)=>`<button class="opt" onclick="answerQ2(${idx})">${idx+1}. ${o}</button>`).join("");
}
function answerQ2(idx){
  const Q = Q2[q2i];
  q2attempts++;
  if (idx === Q.correct){
    let msg;
    if (q2i < 2){
      msg = q2attempts===1 ? "Solide les bases 💪"
          : q2attempts===2 ? "Tu valides au rattrapage, c'est déjà ça"
          : q2attempts===3 ? "J'ai cru que t'y arriverais jamais"
          : "Passons à la suite...";
    } else {
      msg = q2attempts===1 ? "ÇA C'EST MON POULAIN ÇA 🔴⚪" : "Bienvenue du bon côté de la force ;)";
    }
    q2consec = 0;
    const last = (q2i === 2);
    popup("🎯", msg, last ? "Terminer" : "Question suivante", () => {
      if (last){
        popup("🍻","Bravo pour tes réponses ! Bois 2 gorgées avant de reprendre ta chasse.","Santé !",()=>complete(2));
      } else { q2i++; q2attempts = 0; renderQ2(); }
    });
  } else {
    q2consec++;
    let msg;
    if (q2i === 2){ msg = "Naaaan comment t'as pu dire ça..."; }
    else if (q2consec === 1) msg = "Aïe aïe aïe je vais devoir te donner des cours...";
    else if (q2consec === 2) msg = "Même avec 2 chances, sérieux ?";
    else if (q2consec === 3) msg = "...";
    else msg = "... Tu me trolles ?";
    popup("😬", msg, "Réessayer");
  }
}

/* ---------- INDICE 4 : paroles ---------- */
const Q4 = [
  { intro:"3 pas en avant, 3 pas en arrière, 3 pas sur le côté et 3 pas de l'autre côté, c'est qui ?",
    lyrics:"C'est les mines de Douai\nQui sont au cartel\nEt __ __ _______\n_____'__ ____ __ __ ____",
    keys:[["chanter"],["nuit"]],
    answer:"Et on va chanter jusqu'au bout de la nuit" },
  { intro:"",
    lyrics:"Douaiiii l'enstiiim\nSes nuages et son ciel grisonnant\nComme __ _____ __ _____ ___ __ ___ ____ (___ __ ___ ____ !)\nA posé sur le nord de la Franceuh",
    keys:[["verre"],["biere"]],
    answer:"Comme un verre de bière que le bon Dieu (que le bon Dieu !)" },
  { intro:"",
    lyrics:"Alcooool\nAlcooool\nAlcool alcool alcooooool\nOn est venus se bourrer la gueuleuh\nEt _________ ___ _______",
    keys:[["supporter"],["violet","violets"]],
    answer:"Et supporter les violets" }
];
let q4i = 0, q4fails = 0;
function resetQ4(){ q4i = 0; q4fails = 0; renderQ4(); }
function renderQ4(){
  const Q = Q4[q4i];
  document.getElementById("q4box").innerHTML =
    `<p><b>Chanson ${q4i+1}/3</b>${Q.intro ? "\n"+Q.intro : ""}</p>
     <p style="font-style:italic;color:#c9c2ec">${Q.lyrics}</p>
     <input type="text" id="q4in" placeholder="Complète les paroles..." autocomplete="off">
     <button class="btn-main" onclick="answerQ4()">Valider 🎤</button>`;
}
function answerQ4(){
  const Q = Q4[q4i];
  const v = norm(document.getElementById("q4in").value);
  const ok = Q.keys.every(group => group.some(k => v.includes(k)));
  if (ok){
    q4fails = 0;
    const last = (q4i === 2);
    popup("🎶", "✅ « " + Q.answer + " »", last ? "Terminer" : "Suivante", () => {
      if (last){
        popup("🫶","Bravo ! Si t'es mon fillot, il faudra donner ta voix comme on l'a fait au cartel et au comité ultras ! Mais je sais déjà que t'es taillé pour ça 🫶","Suivant",()=>complete(4));
      } else { q4i++; renderQ4(); }
    });
  } else {
    q4fails++;
    if (q4fails >= 3){
      popup("🎤","Bon, je te souffle : « " + Q.answer + " »\nFaudra réviser tes classiques !", "Suivante", () => {
        q4fails = 0;
        if (q4i === 2){
          popup("🫶","Bravo ! Si t'es mon fillot, il faudra donner ta voix comme on l'a fait au cartel et au comité ultras ! Mais je sais déjà que t'es taillé pour ça 🫶","Suivant",()=>complete(4));
        } else { q4i++; renderQ4(); }
      });
    } else {
      popup("🙉","Presque… mais non ! Réessaie 🎵","Réessayer");
    }
  }
}

/* ---------- INDICE 6 : poker ---------- */
function answerQ6(oui){
  const msg = oui
    ? "Eh beh ! On sait pas si c'est la chance ou pas. De toute façon, oublie pas de rejoindre le groupe WhatsApp Poker'IMT pour être au courant des évènements."
    : "Normalement c'est dans le range mais même si tu t'es trompé on s'en fout, ça dépend aussi du niveau des joueurs en face... Mais oublie pas de rejoindre le groupe WhatsApp Poker'IMT.";
  popup(oui ? "♠️" : "♦️", msg, "Suivant", () => complete(6));
}

/* ---------- INDICE 7 : échecs ---------- */
let q7fails = 0;
function answerQ7(move){
  if (move === "Fxc6"){
    popup("♟️","T'es un crack ou t'as triché ? Si t'es chaud on va bien s'amuser. Rejoins le groupe Chess'mate pour être au courant des évènements. Et bois un coup. 🍺","Suivant",()=>complete(7));
  } else {
    q7fails++;
    if (q7fails >= 2){
      popup("🤝","C'est OK mec. Hésite pas à rejoindre le groupe WhatsApp Chess'mate si tu veux apprendre. Et bois un coup. 🍺\n(La solution était Fxc6 !)","Suivant",()=>complete(7));
    } else {
      popup("♟️","Pas ça… Regarde bien : il y a un moyen de gagner un cavalier. Réessaie !","Réessayer");
    }
  }
}

/* ---------- INDICE 8 : capseurs ---------- */
const CAPSEURS = {
  archi:  ["archi","archibald","archi jankie","jankie","winarchi","archibald jankielewicz"],
  autres: ["niv","pierre nivanen","nivanen","gaspard","frog","gaspard hainette","hainette",
           "gaspard frogger","frogger","l homme grenouille","homme grenouille",
           "elliot","teuteu","leo","croque monsieur","croque moustache",
           "chauveau","chauve","chauveau cros"]
};
function matchName(input, list){
  const v = norm(input);
  return list.some(a => v === a || v.split(" ").includes(a) || (a.includes(" ") && v.includes(a)));
}
function answerQ8(){
  const raw = document.getElementById("q8in").value;
  if (matchName(raw, CAPSEURS.archi)){
    popup("🙂‍↕️","Ça c'est sympa 🙂‍↕️","Suivant",()=>complete(8));
  } else if (matchName(raw, CAPSEURS.autres)){
    popup("😏","J'étais une réponse possible…","Suivant",()=>complete(8));
  } else {
    popup("🍺","Hmm, pas sûr que ce soit un capseur aguerri de la MEUD… Réessaie !","Réessayer");
  }
}

/* ---------- INDICE 9 : capitaine ---------- */
function answerQ9(){
  const raw = document.getElementById("q9in").value;
  if (matchName(raw, ["niv","pierre nivanen","nivanen"])){
    popup("🫡","Et 2026-2027 c'est qui ? :)","Suivant",()=>complete(9));
  } else {
    popup("⚽","Eh non ! Réessaie 🫡","Réessayer");
  }
}

/* ---------- Génération des pages ---------- */
document.getElementById("pages").innerHTML = `

<div class="page" id="page1"><div class="card">
  <h2>🧨 Indice N°1</h2>
  <p>Bienvenue dans la terre sainte meudienne !

Tu te trouves dans la résidence dans laquelle j'habite. T'en sauras pas beaucoup plus pour l'instant mais tu peux boire un peu du flash que je t'ai préparé avec amour.

Si tu le secoues, ça pète un peu et ça fume, j'appelle ça une dynamite mais je suis peut-être le seul. 🧨</p>
  <button class="btn-main" onclick="complete(1)">J'ai bu 🍹</button>
</div></div>

<div class="page" id="page2"><div class="card">
  <h2>⚽ Indice N°2 — Quiz foot</h2>
  <div id="q2box"></div>
</div></div>

<div class="page" id="page3"><div class="card">
  <h2>🎨 Indice N°3</h2>
  <p>Oublie pas de cotiser BDA ! Le meilleur bureau !!!

💶 60€ pour 1 an — 80€ pour 3 ans</p>
  <div class="iban">IBAN : FR76 3000 3007 6000 0372 7158 841</div>
  <button class="btn-main" onclick="complete(3)">C'est noté 📝</button>
</div></div>

<div class="page" id="page4"><div class="card">
  <h2>🎤 Indice N°4 — N'oubliez pas les paroles !</h2>
  <div id="q4box"></div>
</div></div>

<div class="page" id="page5"><div class="card">
  <h2>🤞 Indice N°5</h2>
  <div class="bigemoji">🤞</div>
  <p>Si t'as bien suivi, tu dois reconnaître ce symbole... J'en ai été responsable ;)

Pour le prochain indice, joue au stand <b>BLACKJACK</b> sinon tu n'auras rien...

Oublie pas de boire un coup de ton flash ! 🍹</p>
  <button class="btn-main" onclick="complete(5)">Direction le Blackjack 🃏</button>
</div></div>

<div class="page" id="page6"><div class="card">
  <h2>🃏 Indice N°6 — Poker</h2>
  <p>Est-ce que tu joues <b>J9 suité</b> en étant bouton ?</p>
  <button class="opt" onclick="answerQ6(true)">Oui</button>

/* ---------- Reset caché (7 taps sur le titre) ---------- */
let taps = 0, tapTimer = null;
document.getElementById("title").addEventListener("click", ()=>{
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(()=>taps=0, 1500);
  if (taps >= 7){
    taps = 0;
    if (confirm("Réinitialiser toute la progression ?")){
      localStorage.removeItem("abawaqayo"); state = {done:[]}; renderMenu(); toast("Progression réinitialisée 🔄");
    }
  }
});

/* ---------- Démarrage ---------- */
(function init(){
  const frag = decodeURIComponent(location.hash.replace("#","")).trim();
  history.replaceState(null,"",location.pathname);
  if (frag && Object.values(CODES).includes(frag)){ handleCode(frag); return; }
  if (!isDone(1)){ openClue(1); return; }   // 1re visite : message de bienvenue
  show("menu");
})();
